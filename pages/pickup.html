<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickup & Delivery</title>

<link rel="stylesheet" href="pickup.css">
</head>

<body>

<div class="input-panel">

<h2>🚚 Loading Details</h2>

<div class="input-box">
  <input type="date" id="date" required>
  <label>Date</label>
</div>

<div class="input-box">
  <input type="text" id="trailer" required>
  <label>Trailer Number</label>
</div>

<div class="input-box">
  <input type="number" id="mobile" required>
  <label>Driver Mobile Number</label>
</div>

<div class="input-box">
  <input type="text" id="transport" required>
  <label>Transporter Name</label>
</div>

<div id="carsContainer">

<div class="car-block">

<h3>🚗 Car 1 Details</h3>

<div class="input-box">

  <input type="text" class="carname" required>

  <label>Car Name</label>

  <div class="suggestions carSuggestions"></div>

</div>

<div class="input-box">
  <input type="text" class="carno" required>
  <label>Car Number</label>
</div>

<div class="input-box">
  <input type="text" class="carvalue" required>
  <label>Car Value</label>
</div>

<div class="input-box">
  <input type="text" class="packer" required>
  <label>Packer Name</label>
</div>

<div class="input-box">

<input type="text"

class="partyname"

required>

<label>Party Name</label>

</div>

<div class="input-box">

  <input type="text" class="from" required>

  <label>From</label>

  <div class="suggestions fromSuggestions"></div>

</div>

<div class="input-box">

  <input type="text" class="to" required>

  <label>To</label>

  <div class="suggestions toSuggestions"></div>

</div>

<div class="input-box">

<input type="text"

class="pincode"

required>

<label>Pincode</label>

</div>

<div class="delete-icon" onclick="deleteCar(this)">
❌
</div>

</div>

</div>

<button class="add" type="button" onclick="addMoreCar()">
➕ Add More Car
</button>

<button type="button" onclick="savePickupData()">
Submit Entry
</button>

<div class="input-box">
  <input type="text" id="searchId" required>
  <label>Enter Entry ID</label>
</div>
<button type="button" onclick="searchEntry()">
🔍 Search Entry
</button>

<button type="button" onclick="updateEntry()">
✏️ Update Entry
</button>

<button type="button"

onclick="shareEntry()">

📤 Share Entry

</button>

<div id="searchResult"></div>


</div>

<div id="sharePopup">

<div class="share-box">

<h3>Select Cars To Share</h3>

<div id="shareCarsList">

</div>

<button
onclick="copySelectedCars()">

📋 Copy Selected

</button>

<button
onclick="shareSelectedCars()">

🟢 Share WhatsApp

</button>

<button
onclick="downloadPdf()">

📄 PDF

</button>

<button
onclick="closeSharePopup()">

❌ Close

</button>

</div>

</div>

<div id="biltyPopup">

<div class="share-box">

<h3>🧾 Select Cars For Bilty</h3>

<div id="biltyCarsList">

</div>

<button
onclick="createSelectedBilty()">

✅ Create Bilty

</button>

<button
onclick="closeBiltyPopup()">

⏭️ Skip

</button>

</div>

</div>

<script src="pickup.js"></script>

</body>
</html>
