<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickup & Delivery</title>

<link rel="stylesheet" href="pickup.css">
</head>

<body>

<div class="input-panel">

<h2>🚚 Pickup & Delivery</h2>

<div class="input-box">
  <input type="date" id="date" required>
  <label>Date</label>
</div>

<div class="input-box">
  <input type="text" id="trailer" required>
  <label>Trailer Number</label>
</div>

<div class="input-box">
  <input type="number" id="mobile" required>
  <label>Driver Mobile Number</label>
</div>

<div class="input-box">
  <input type="text" id="transport" required>
  <label>Transporter Name</label>
</div>

<div id="carsContainer">

<div class="car-block">

<h3>🚗 Car 1 Details</h3>

<div class="input-box">
  <input type="text" class="carname" required>
  <label>Car Name</label>
</div>

<div class="input-box">
  <input type="text" class="carno" required>
  <label>Car Number</label>
</div>

<div class="input-box">
  <input type="text" class="carvalue" required>
  <label>Car Value</label>
</div>

<div class="input-box">
  <input type="text" class="packer" required>
  <label>Packer Name</label>
</div>

<div class="input-box">
  <input type="text" class="from" required>
  <label>From</label>
</div>

<div class="input-box">
  <input type="text" class="to" required>
  <label>To</label>
</div>

<div class="delete-icon" onclick="deleteCar(this)">
❌
</div>

</div>

</div>

<button class="add" type="button" onclick="addMoreCar()">
➕ Add More Car
</button>

<button type="button" onclick="savePickupData()">
Submit Entry
</button>

</div>

<script src="pickup.js"></script>

</body>
</html>
